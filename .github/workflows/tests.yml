name: Clinical study data tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,dashboard]'
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Run all unit and database integration tests
        run: python -m pytest -q -rs
      - name: End-to-end smoke test
        run: python -m clinical_trial.smoke
      - name: Generate and verify synthetic data
        run: |
          python -m clinical_trial.generate --participants 30 --output-dir data/generated
          python -m clinical_trial.verify --input-dir data/generated
      - name: Ingest the dataset into DuckDB
        run: |
          python -m clinical_trial.ingest --input-dir data/generated --db data/ci.duckdb
          python -m clinical_trial.ingest --input-dir data/generated --db data/ci.duckdb
          python -m clinical_trial.ingest --db data/ci.duckdb --status
      - name: Review clinical study data quality
        run: python -m clinical_trial.quality --db data/ci.duckdb --report data/quality/issues.csv
      - name: Evaluate controlled synthetic defects
        run: |
          python -m clinical_trial.generate --participants 180 --output-dir data/challenge_clean
          python -m clinical_trial.challenge inject --source data/challenge_clean --output data/challenge
          python -m clinical_trial.verify --input-dir data/challenge
          python -m clinical_trial.ingest --input-dir data/challenge --db data/challenge.duckdb
          python -m clinical_trial.challenge score --db data/challenge.duckdb --truth data/challenge/ground_truth.json --report-dir data/benchmark
          python -c "import json; r=json.load(open('data/benchmark/benchmark.json')); assert r['overall']['tp']==22 and r['overall']['fp']==0 and r['overall']['fn']==0"
      - name: Verify synthetic export and review modules
        run: |
          python -m clinical_trial.export_domains --help
          python -m clinical_trial.review --help
      - name: Verify complete synthetic study workflow in a fresh directory
        run: python scripts/verify_release.py
