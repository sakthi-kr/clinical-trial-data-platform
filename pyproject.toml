[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-data-platform"
version = "0.6.0"
description = "Synthetic clinical study data ingestion, quality checks and reproducible fault-injection evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sakthikumaran Ravichandran"}]
dependencies = ["duckdb>=1.4.3,<3.0", "pytz>=2024.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.scripts]
clinical-trial-generate = "clinical_trial.generate:main"
clinical-trial-ingest = "clinical_trial.ingest:main"
clinical-trial-verify = "clinical_trial.verify:main"
clinical-trial-quality = "clinical_trial.quality:main"
clinical-trial-benchmark = "clinical_trial.challenge:main"
clinical-trial-review = "clinical_trial.review:main"
clinical-trial-export = "clinical_trial.export_domains:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
clinical_trial = ["db_schema.sql"]
